{% extends "base.html" %}
{% block title %}Đổi mật khẩu · {{ restaurant.name }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
  <h1>Đổi mật khẩu</h1>
  <form method="post" class="card accent" autocomplete="off">
    <label for="old">Mật khẩu hiện tại</label>
    <input id="old" type="password" name="old" required autocomplete="current-password" style="width:100%">
    <label for="new">Mật khẩu mới (tối thiểu 6 ký tự)</label>
    <input id="new" type="password" name="new" required minlength="6" autocomplete="new-password" style="width:100%">
    <label for="repeat">Nhập lại mật khẩu mới</label>
    <input id="repeat" type="password" name="repeat" required minlength="6" autocomplete="new-password" style="width:100%">
    <p style="margin-bottom:0"><button class="red" type="submit">Đổi mật khẩu</button></p>
  </form>
  <p class="muted">Quên mật khẩu hiện tại thì nhờ Admin đặt lại.</p>
{% endblock %}
